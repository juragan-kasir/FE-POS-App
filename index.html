<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/mini-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Juragan Kasir" />
    <meta name="description" content="Aplikasi kasir untuk usaha kuliner Indonesia. Kasir, stok, dan laporan dalam satu aplikasi — dari satu warung sampai puluhan cabang." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Juragan Kasir" />
    <meta property="og:title" content="Juragan Kasir — Jualan makin laris, cuan makin jelas" />
    <meta property="og:description" content="Aplikasi kasir untuk usaha kuliner Indonesia. Kasir, stok, dan laporan dalam satu aplikasi — dari satu warung sampai puluhan cabang." />
    <meta property="og:url" content="https://pos.juragankasir.com" />
    <meta property="og:image" content="https://pos.juragankasir.com/logo-512.png" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Terapkan tema tersimpan SEBELUM React mount agar tidak ada flash (FOUC).
      // Baca dari localStorage yang sama dengan zustand persist "app-theme".
      try {
        var _t = JSON.parse(localStorage.getItem("app-theme") || "{}");
        if (_t.state && _t.state.theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <title>Juragan Kasir</title>
    <script>
      // ponytail: mulai fetch translasi SEJAJAR dengan entry JS — tanpa ini,
      // fetch baru jalan setelah i18n init (menunggu JS selesai parse+exec).
      // Baca bahasa dari sessionStorage yang sama dengan zustand persist.
      try {
        var t = JSON.parse(sessionStorage.getItem("translation") || "{}");
        var lng = (t.state && t.state.translation) || "id";
        var supported = ["en", "id"];
        if (supported.indexOf(lng) === -1) lng = "id";
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "fetch";
        l.type = "application/json";
        l.href = "/locales/" + lng + "/translation.json";
        document.head.appendChild(l);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
