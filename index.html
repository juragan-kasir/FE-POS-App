    <meta property="og:title" content="Juragan Kasir — Urusan toko beres, kamu fokus jualan" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Terapkan tema tersimpan SEBELUM React mount agar tidak ada flash (FOUC).
      // Baca dari localStorage yang sama dengan zustand persist "app-theme".
      try {
        var _t = JSON.parse(localStorage.getItem("app-theme") || "{}");
        if (_t.state && _t.state.theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <title>Juragan Kasir</title>
    <script>
      // ponytail: mulai fetch translasi SEJAJAR dengan entry JS — tanpa ini,
      // fetch baru jalan setelah i18n init (menunggu JS selesai parse+exec).
      // Baca bahasa dari sessionStorage yang sama dengan zustand persist.
      try {
        var t = JSON.parse(sessionStorage.getItem("translation") || "{}");
        var lng = (t.state && t.state.translation) || "id";
        var supported = ["en", "id"];
        if (supported.indexOf(lng) === -1) lng = "id";
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "fetch";
        l.type = "application/json";
        l.crossOrigin = "anonymous";
        l.href = "/locales/" + lng + "/translation.json?v=%TRANSLATION_BUILD_REF%";
        document.head.appendChild(l);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div role="status" style="display: flex; min-height: 100vh; align-items: center; justify-content: center">
        <img src="/favicon-48x48.png" alt="Juragan Kasir" width="48" height="48" />
      </div>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
